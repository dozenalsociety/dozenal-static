</style></head><body><header><h1>Uncial Clock Deluxe (Web Edition)</h1><p>Dozenal numbers are annotated with a subscript-z. Decimal numbers are annotated with a subscript-d.</p><button type="button" class="settings-toggle" id="settings-toggle" aria-label="Show global settings" title="Show global settings" aria-expanded="false" aria-controls="settings-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></header><main><div id="settings-panel" class="settings-panel" hidden><div class="controls"><label>Digit set <select id="digits"><option value="↊↋">Pitman (↊ ↋)</option><option value="ᘔƐ">Alt Pitman (ᘔ Ɛ)</option><option value="XE">DSA (X E)</option><option value="TE">DSGB (T E)</option><option value="AB">Computerese (A B)</option></select></label><label>Terminology <select id="terminology"><option value="colloquial" selected>Colloquial</option><option value="technical">Technical</option></select></label><label>Movement <select id="movement"><option value="continuous">Continuous</option><option value="discrete">Discrete</option></select></label><label><span title="Sunrise and sunset are fixed six-hour reference points, not astronomical sunrise or sunset.">Day begins</span> <select id="start"><option value="0">Midnight</option><option value="6">Sunrise (06:00)</option><option value="12">Noon</option><option value="18">Sunset (18:00)</option></select></label><label>Direction <select id="direction"><option value="1">Clockwise</option><option value="-1">Counterclockwise</option></select></label><label>Time zone <select id="zone"></select></label><label><span id="bells-offset-label" title="Double-click the value to reset to zero.">Bells Offset</span><span id="bells-offset-spinner" class="numeric-spinner bells-offset-spinner" role="group" aria-label="Bells Offset" tabindex="0"></span></label></div><div class="controls" style="margin-top:10px" id="visibility"><label><input type="checkbox" value="diurnal" checked>Diurnal</label><label><input type="checkbox" value="semidiurnal" checked>Semidiurnal</label><label><input type="checkbox" value="shiftic">Shiftic</label><label><input type="checkbox" value="phasic">Phasic</label><label><input type="checkbox" id="marks" checked>Fine marks</label><label><input type="checkbox" id="labels" checked>Numerals</label><button type="button" id="factory-reset" class="factory-reset">Factory Reset</button></div></div><dialog id="factory-reset-dialog" class="reset-dialog" aria-labelledby="reset-dialog-title"><h2 id="reset-dialog-title">Factory Reset</h2><p>Reset all settings to their first-startup defaults? This will erase your saved preferences, including all global and dial-specific settings.</p><div class="reset-actions"><button type="button" id="cancel-reset">Cancel</button><button type="button" id="confirm-reset" class="confirm-reset">Reset all settings</button></div></dialog><div id="current-zone-name" class="zone-heading" aria-live="polite"><div id="zone-date" class="zone-date"></div><div id="zone-description"></div></div><div class="grid" id="grid"></div></main><script>

$('settings-toggle').addEventListener('click',()=>{

// Each readout position has an identical fixed-width cell. Only the glyph rotates.

for(const [id,title] of specs){const section=document.createElement('section');section.className='dial';section.id='dial-'+id;section.innerHTML=`<h2>${title}</h2><canvas width="700" height="700"></canvas><div class="digital-display"><div class="digital-panel"><span class="digital-label" style="grid-column:1;grid-row:1">Time</span><div class="readout time-readout"></div><span class="unit-name"></span></div></div><div class="dial-bottom"><div class="offset-panel"><span class="digital-label">Zone Offset</span><div class="readout offset-readout"></div><span class="digital-trailing">from UTC</span></div><button type="button" class="dial-toggle" aria-expanded="false" aria-controls="${id}-settings" aria-label="Show dial settings" title="Show dial settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div><div class="dial-settings" id="${id}-settings" hidden><div class="dial-options"><div class="dial-setting"><span>Orientation</span><select class="orientation-select" aria-label="Dial orientation"><option value="up">Zero Up</option><option value="left">Zero Left</option><option value="down">Zero Down</option><option value="right">Zero Right</option></select></div><div class="dial-setting"><span>Hands</span><div class="color-dropdown" data-kind="hands"></div></div><div class="dial-setting"><span>Digit Precision</span><div class="color-dropdown" data-kind="precision"></div></div><div class="dial-setting"><span>Radix Point After</span><div class="color-dropdown" data-kind="radix"></div></div></div><div class="clock-legend" aria-label="Clock legend"></div></div>`;$('grid').append(section);section.querySelector('.dial-toggle').addEventListener('click',e=>{const panel=section.querySelector('.dial-settings');if(panel.hidden){setAllSettingsOpen();}else{setAllSettingsClosed();}});}
// Precision is the number of colored positions (1 through 6).
// The white period index (position 0) remains visible on non-diurnal clocks.
// The radix position is independent of precision, and is hidden if radix >= precision.
const digitalSettings=Object.fromEntries(specs.map(([id])=>[id,{orientation:id==='diurnal'?'down':'up',precision:id==='diurnal'?5:4,radix:id==='diurnal'?3:1,hands:4}]));
// Versioned browser preferences. Fail gracefully where storage is unavailable (e.g. restrictive file:// settings).
const STORAGE_KEY='uncial-clock-deluxe.preferences.v1';
// Populate every IANA time zone supported by the browser, and default to its own zone.
const browserZone=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';
const timeZones=typeof Intl.supportedValuesOf==='function'
  ? Intl.supportedValuesOf('timeZone') : [browserZone,'UTC'];
const zoneChoices=[...new Set(['UTC',browserZone,...timeZones])].sort((a,b)=>a.localeCompare(b));
$('zone').replaceChildren(...zoneChoices.map(name=>new Option(name===browserZone?`${name} (browser local)`:name,name)));

function updateZoneHeading(now=shiftedNow()){
 const zone=$('zone').value;
 const readable=zone.replaceAll('_',' ').replace(/\//g,' / ');
 let descriptive=readable;
 try {
   const part=new Intl.DateTimeFormat('en-US',{timeZone:zone,timeZoneName:'long'}).formatToParts(now).find(p=>p.type==='timeZoneName');
   if(part?.value) descriptive=part.value;
 } catch(e) { /* Retain the readable IANA identifier if unsupported. */ }
 $('zone-description').textContent=`${descriptive} (${zone})`;
 // ISO 8601 calendar-date order, with each component expressed in base twelve.
 // Extract the date in the selected zone, not the browser's local zone.
 const dateParts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{
   timeZone:zone,year:'numeric',month:'numeric',day:'numeric',weekday:'short'
 }).formatToParts(now).filter(part=>['year','month','day','weekday'].includes(part.type)).map(part=>[part.type,part.type==='weekday'?part.value:Number(part.value)]));
 const dozenal=n=>n.toString(12).toUpperCase().replace(/A/g,$('digits').value[0]).replace(/B/g,$('digits').value[1]);
 const year=dozenal(dateParts.year).padStart(4,'0');
 const month=dozenal(dateParts.month).padStart(2,'0');
 const day=dozenal(dateParts.day).padStart(2,'0');
 const dateBox=$('zone-date');
 dateBox.replaceChildren();
 // Use the currently selected digit set for ten and eleven.
 dateBox.append(document.createTextNode(`${dateParts.weekday} ${year}-${month}-${day}`));
 const sub=document.createElement('sub');sub.textContent='z';$('zone-date').append(sub);
}

$('digits').addEventListener('change',updateZoneHeading);
const zoneFormatters=new Map();
function zonedHours(now,zone){
  let formatter=zoneFormatters.get(zone);
  if(!formatter){formatter=new Intl.DateTimeFormat('en-US',{timeZone:zone,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});zoneFormatters.set(zone,formatter);}
  const parts=Object.fromEntries(formatter.formatToParts(now).filter(p=>p.type!=='literal').map(p=>[p.type,Number(p.value)]));
  return parts.hour+parts.minute/60+parts.second/3600+now.getMilliseconds()/3600000;
}

function renderBellsOffset(){

}
{const spinner=$('bells-offset-spinner');const value=document.createElement('span');value.className='spinner-value';const buttons=document.createElement('span');buttons.className='spinner-buttons';for(const [symbol,step] of [['▲',1],['▼',-1]]){const b=document.createElement('button');b.type='button';b.className='spinner-arrow';b.textContent=symbol;b.dataset.step=String(step);b.addEventListener('click',()=>changeBellsOffset(step));buttons.append(b);}spinner.append(value,buttons);value.title='Double-click to reset offset to zero';value.addEventListener('dblclick',()=>changeBellsOffset(-bellsOffset));spinner.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();changeBellsOffset(e.key==='ArrowUp'?1:-1);}});renderBellsOffset();}

}
