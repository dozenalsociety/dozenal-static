/* Compact vertical-arrow spinners for the three numeric dial settings. */
.numeric-spinner{display:inline-flex;align-items:stretch;width:48px;min-width:48px;height:30px;box-sizing:border-box;background:#111d30;border:1px solid #526078;border-radius:6px;overflow:hidden}
.numeric-spinner .spinner-value{flex:1;display:flex;align-items:center;justify-content:center;font:16px ui-monospace,monospace;min-width:0}
.numeric-spinner .spinner-buttons{display:flex;flex-direction:column;width:17px;border-left:1px solid #526078}
.numeric-spinner .spinner-arrow{flex:1;display:grid;place-items:center;width:100%;min-height:0;padding:0;border:0;background:#273750;color:#e7ecf5;font:9px/1 system-ui,sans-serif;cursor:pointer}
.numeric-spinner .spinner-arrow:first-child{border-bottom:1px solid #526078}
.numeric-spinner .spinner-arrow:hover:not(:disabled),.numeric-spinner .spinner-arrow:focus-visible{background:#42618b;outline:none}
.numeric-spinner .spinner-arrow:disabled{opacity:.35;cursor:default}

.real-pitman-glossary{font-family:"Uncial Real Pitman",system-ui,sans-serif}</style></head><body><header><h1>Uncial Clock Deluxe (Web Edition)</h1><p>Dozenal numbers are annotated with a subscript-z. Decimal numbers are annotated with a subscript-d.</p><button type="button" class="settings-toggle" id="settings-toggle" aria-label="Show global settings" title="Show global settings" aria-expanded="false" aria-controls="settings-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></header><main><div id="settings-panel" class="settings-panel" hidden><div class="controls"><label>Digit set <select id="digits"><option value="↊↋">Pitman (↊ ↋)</option><option value="real-pitman">Real Pitman (↊ ↋)</option><option value="ᘔƐ">Alt Pitman (ᘔ Ɛ)</option><option value="XE">DSA (X E)</option><option value="TE">DSGB (T E)</option><option value="AB">Computerese (A B)</option></select></label><label>Terminology <select id="terminology"><option value="colloquial" selected>Colloquial</option><option value="technical">Technical</option></select></label><label>Movement <select id="movement"><option value="continuous">Continuous</option><option value="discrete">Discrete</option></select></label><label><span title="Sunrise and sunset are fixed six-hour reference points, not astronomical sunrise or sunset.">Day begins</span> <select id="start"><option value="0">Midnight</option><option value="6">Sunrise (06:00)</option><option value="12">Noon</option><option value="18">Sunset (18:00)</option></select></label><label>Direction <select id="direction"><option value="1">Clockwise</option><option value="-1">Counterclockwise</option></select></label><label>Time zone <select id="zone"></select></label><label><span id="bells-offset-label" title="Double-click the value to reset to zero.">Bells Offset</span><span id="bells-offset-spinner" class="numeric-spinner bells-offset-spinner" role="group" aria-label="Bells Offset" tabindex="0"></span></label></div><div class="controls" style="margin-top:10px" id="visibility"><label><input type="checkbox" value="diurnal" checked>Diurnal</label><label><input type="checkbox" value="semidiurnal" checked>Semidiurnal</label><label><input type="checkbox" value="shiftic">Shiftic</label><label><input type="checkbox" value="phasic">Phasic</label><label><input type="checkbox" id="marks" checked>Fine marks</label><label><input type="checkbox" id="labels" checked>Numerals</label><button type="button" id="factory-reset" class="factory-reset">Factory Reset</button></div></div><dialog id="factory-reset-dialog" class="reset-dialog" aria-labelledby="reset-dialog-title"><h2 id="reset-dialog-title">Factory Reset</h2><p>Reset all settings to their first-startup defaults? This will erase your saved preferences, including all global and dial-specific settings.</p><div class="reset-actions"><button type="button" id="cancel-reset">Cancel</button><button type="button" id="confirm-reset" class="confirm-reset">Reset all settings</button></div></dialog><div id="current-zone-name" class="zone-heading" aria-live="polite"><div id="zone-date" class="zone-date"></div><div id="zone-description"></div></div><div class="grid" id="grid"></div></main><script>
'use strict';

const specs=[['diurnal','Diurnal · Primel',24,0],['semidiurnal','Semidiurnal',12,1],['shiftic','Shiftic',8,1],['phasic','Phasic',6,1]];
const colors=['#ff80ff','#ffc0c0','#ffff60','#80ff80','#6096ff','#8060ff']; // original Java: magenta, light pink, yellow, green, blue, violet
const $=id=>document.getElementById(id);const mod=(x,n)=>((x%n)+n)%n;
$('settings-toggle').addEventListener('click',()=>{
  const panel=$('settings-panel'),button=$('settings-toggle');
  const expanded=panel.hidden;
  panel.hidden=!expanded;
  button.setAttribute('aria-expanded',String(expanded));
  button.querySelector('svg path').setAttribute('d',expanded?'m6 15 6-6 6 6':'m6 9 6 6 6-6');
  button.setAttribute('aria-label',expanded?'Hide global settings':'Show global settings');
  button.title=expanded?'Hide global settings':'Show global settings';
  for(const id of clockIds){
    const clockPanel=$(id+'-settings');
    const toggle=$('dial-'+id).querySelector('.dial-toggle');
    clockPanel.hidden=!expanded;
    toggle.setAttribute('aria-expanded',String(expanded));
    toggle.querySelector('path').setAttribute('d',expanded?'m6 15 6-6 6 6':'m6 9 6 6 6-6');
    toggle.title=expanded?'Hide dial settings':'Show dial settings';
    toggle.setAttribute('aria-label',`${expanded?'Hide':'Show'} ${dialTitles[id][$('terminology').value]} dial settings`);
  }
});
function setAllSettingsOpen(){
  const globalPanel=$('settings-panel'),globalButton=$('settings-toggle');
  globalPanel.hidden=false;
  globalButton.setAttribute('aria-expanded','true');
  globalButton.querySelector('path').setAttribute('d','m6 15 6-6 6 6');
  globalButton.title='Hide global settings';
  globalButton.setAttribute('aria-label','Hide global settings');
  for(const id of clockIds){
    const panel=$(id+'-settings'),button=$('dial-'+id).querySelector('.dial-toggle');
    panel.hidden=false;
    button.setAttribute('aria-expanded','true');
    button.querySelector('path').setAttribute('d','m6 15 6-6 6 6');
    button.title='Hide dial settings';
    button.setAttribute('aria-label',`Hide ${dialTitles[id][$('terminology').value]} dial settings`);
  }
}
function setAllSettingsClosed(){
  const globalPanel=$('settings-panel'),globalButton=$('settings-toggle');
  globalPanel.hidden=true;
  globalButton.setAttribute('aria-expanded','false');
  globalButton.querySelector('path').setAttribute('d','m6 9 6 6 6-6');
  globalButton.title='Show global settings';
  globalButton.setAttribute('aria-label','Show global settings');
  for(const id of clockIds){
    const panel=$(id+'-settings'),button=$('dial-'+id).querySelector('.dial-toggle');
    panel.hidden=true;
    button.setAttribute('aria-expanded','false');

 sweep:'<p><b>Sweep</b>: (1) 1/1000<sub>z</sub> = 1/1728<sub>d</sub> of a semiday, equivalent to 21<sub>z</sub> = 25<sub>d</sub> seconds; a <b>sweep·duration</b> or <b>tricia·semiday</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun during a sweep; 1/100<sub>z</sub> = 1/1728<sub>d</sub> of a semiturn, equivalent to 6′15″<sub>d</sub> of arc; a <b>sweep·angle</b> or <b>tricia·semiturn</b>.</p><p><i>Etymology:</i> From the expression “sweep second hand,” although even more apt since the hand which has this period (the pause hand) “sweeps” more than twice as fast as the second hand on a traditional clock.</p>',
 clock:'<p><b>Clock</b>: Half of a mean solar day, i.e., a <b>semiday</b>; 10<sub>z</sub> = 12<sub>d</sub> hours; 500<sub>z</sub> = 720<sub>d</sub> minutes; 21,000<sub>z</sub> = 43,200<sub>d</sub> seconds; one half <b>prime·hexqua·timel</b>, i.e. 600,000<sub>z</sub> = 1,492,992<sub>d</sub> prime·timels (where the <b>prime·timel</b> is the coherent unit of time for physics in the <b>Primel</b> metrology).</p><p>This is the duration of a <b>semiturn,</b> or half-rotation, of the Earth with respect to the Sun (600<sub>z</sub> trice·angles or 180°<sub>d</sub> of arc).</p><p><i>Etymology:</i> This is the period of a traditional sexagesimal clock.</p>',
 day:'<p><b>Day</b>: A mean solar day; the duration of one full <b>turn</b> or <b>rotation</b> of the Earth with respect to the Sun; 20<sub>z</sub> = 24<sub>d</sub> hours; ↊00<sub>z</sub> = 1,440<sub>d</sub> minutes; 42,000<sub>z</sub> = 86,400<sub>d</sub> seconds; one <b>prime·hexqua·timel</b>, i.e. 1,000,000<sub>z</sub> = 2,985,984<sub>d</sub> prime·timels (where the <b>prime·timel</b> is the coherent unit of time for physics in the <b>Primel</b> metrology).</p>',
 vibe:'<p><b>Vibe</b>: (1) 1/1,000,000<sub>z</sub> = 1/2,985,984<sub>d</sub> of a day, equivalent to 0.042<sub>z</sub> = 0.02893<span class="repeating-digits">518</span><sub>d</sub> seconds; a <b>vibe·duration</b> or <b>hexcia·day</b>. This is the <b>prime·timel</b>, the coherent unit of time for physics in the <b>Primel</b> metrology.</p><p>(2) The amount the Earth rotates with respect to the Sun during a vibe; 1/1,000,000<sub>z</sub> = 1/2,985,984<sub>d</sub> of a turn, equivalent to 0.43402<span class="repeating-digits">7</span>″<sub>d</sub> of arc; a <b>vibe·angle</b> or <b>hexcia·turn</b>.</p><p><i>Etymology:</i> Colloquial contraction of “vibration.” This is the period for a frequency of 34.56<sub>d</sub> hertz (1 <b>prime·frequenciel</b>). As a sound, this is approximately C-sharp in octave 0 (C♯<sub>0</sub>), a vibration near the threshold of the audible range.</p>',
 twinkling:'<p><b>Twinkling</b>: (1) 1/100,000<sub>z</sub> = 1/248,832<sub>d</sub> of a day, equivalent to 0.42<sub>z</sub> = 0.347<span class="repeating-digits">2</span><sub>d</sub> seconds; a <b>twinkling·duration</b> or <b>pentcia·day</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun in a twinkling; 1/100,000<sub>z</sub> = 1/248,832<sub>d</sub> of a turn, equivalent to 5.208<span style="text-decoration:overline">3</span>″<sub>d</sub> of arc; a <b>twinkling·angle</b> or <b>pentcia·turn</b>.</p><p><i>Etymology:</i> A slightly archaic word for a very brief amount time, akin to the blink of an eye. At slightly more than a third of a second, this is in fact about the upper limit for an eye blink.</p>',
 lull:'<p><b>Lull</b>: (1) 1/10,000<sub>z</sub> = 1/20,736<sub>d</sub> of a day, equivalent to 4.2<sub>z</sub> = 4.1<span class="repeating-digits">6</span><sub>d</sub> seconds; a <b>lull·duration</b> or <b>quadcia·day</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun in a <b>quadcia·day</b>; 1/10,000<sub>z</sub> = 1/20,736<sub>d</sub> of a turn, equivalent to 1′2.5″<sub>d</sub> of arc; a <b>lull·angle</b> or <b>quadcia·turn</b>.</p><p><i>Etymology:</i> At slightly more than 4 seconds, this is enough for a long, embarrassing pause in a conversation, i.e., a “lull.”</p>',
 trice:'<p><b>Trice</b>: (1) 1/1000<sub>z</sub> = 1/1728<sub>d</sub> of a day, equivalent to 42<sub>z</sub> = 50<sub>d</sub> seconds; a <b>trice·duration</b> or <b>tricia·day</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun in a trice; 1/1000<sub>z</sub> = 1/1728<sub>d</sub> of a turn, equivalent to 12′30″<sub>d</sub> of arc; a <b>trice·angle</b> or <b>tricia·turn</b>.</p><p><i>Etymology:</i> A slightly archaic word for a brief amount of time, and a pun on dividing the day by a dozen “thrice”.</p>',
 break:'<p><b>Break</b>: (1) 1/100<sub>z</sub> = 1/144<sub>d</sub> (one pergross) of a semiday, equivalent to 6 trices or 5 minutes; a <b>break·duration</b> or <b>bicia·semiday</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun during a break; 1/100<sub>z</sub> = 1/144<sub>d</sub> (one pergross) of a semiturn, equivalent to 6 trices or 1°15′<sub>d</sub> of arc; a <b>break·angle</b> or <b>bicia·semiturn</b>.</p><p><i>Etymology:</i> From the colloquial expression “take a break,” indicating a brief time of rest from effort. Related to the expression “take five,” with similar meaning referencing five minutes, but without any sexagesimal association.</p>',
 breather:'<p><b>Breather</b>: (1) 1/100<sub>z</sub> = 1/144<sub>d</sub> (one pergross) of a day, equivalent to 10<sub>z</sub> trices or 10<sub>d</sub> minutes; a <b>breather·duration</b> or <b>bicia·day</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun during a breather; 1/100<sub>z</sub> = 1/144<sub>d</sub> (one pergross) of a turn. equivalent to 10<sub>z</sub> trices or 2°30′<sub>d</sub> of arc; a <b>breather·angle</b> or <b>bicia·turn</b>.</p><p><i>Etymology:</i> From the colloquial expression “take a breather,” indicating a brief time of rest from effort. Related to the expression “take ten,” with similar meaning referencing ten minutes, but without any sexagesimal association.</p>',
 dwell:'<p><b>Dwell</b>: (1) 1/10<sub>z</sub> = 1/12<sub>d</sub> of a day, equivalent to 100<sub>z</sub> trices or 120<sub>d</sub> minutes; two hours; a <b>dwell·duration</b> or <b>uncia·day</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun during a dwell; 1/10<sub>z</sub> = 1/12<sub>d</sub> of a turn, equivalent to 100<sub>z</sub> trices or 30°<sub>d</sub> of arc; a <b>dwell·angle</b> or <b>uncia·turn</b>.</p><p><i>Etymology:</i> The time the Sun spends “dwelling” in each “house” during a day, where a <b>house</b> is an astrological term for an <b>uncia·turn</b> sector of the sky relative to the observer; also, a pun on “dual hour”. If anyone focuses their attention on any one subject for an entire dwell, it is fair to say that the are “dwelling” on it.</p>',
 hour:'<p><b>Hour</b>: (1) 1/20<sub>z</sub> = 1/24<sub>d</sub> of a day, equivalent to 60<sub>z</sub> trices or 60<sub>d</sub> minutes; a half-dwell; an <b>hour·duration</b> or <b>uncia·semiday</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun in an hour; 1/20<sub>z</sub> = 1/24<sub>d</sub> of a turn, equivalent to 60<sub>z</sub> trices or 15°<sub>d</sub> of arc; an <b>hour·angle</b> or <b>uncia·semiturn</b>.</p><p><i>Etymology:</i> From Greek <i>ὥρα</i> “hour; any time or period.”</p>',
 bell:'<p><b>Bell</b>: (1) 1/40<sub>z</sub> = 1/48<sub>d</sub> of a day, equivalent to 30<sub>z</sub> trices or 30<sub>d</sub> minutes; a half-hour or quarter-dwell; a <b>bell·duration</b> or <b>uncia·quarterday</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun in a bell; 1/40<sub>z</sub> = 1/48<sub>d</sub> of a turn, equivalent to 30<sub>z</sub> trices or 7°30′<sub>d</sub> of arc; a <b>bell·angle</b> or <b>uncia·quarterturn</b>.</p><p><i>Etymology:</i> From nautical terminology, a “ship’s bell.”</p>'

const unitGlossaryPopup=document.createElement('div');

function placeUnitGlossary(x,y){
 const w=unitGlossaryPopup.offsetWidth,h=unitGlossaryPopup.offsetHeight;
 const gap=52;
 let left=x+gap,top=y+gap;
 if(left+w>innerWidth-8)left=x-w-gap;
 if(top+h>innerHeight-8)top=y-h-gap;
 unitGlossaryPopup.style.left=Math.max(8,left)+'px';
 unitGlossaryPopup.style.top=Math.max(8,top)+'px';
}
// Convert transdecimal digits in tooltip numerals tagged with a dozenal subscript.
// Ordinary prose and decimal numerals are deliberately left untouched.
function applyGlossaryDigitSet(root){
 const symbols=digitSymbols();
 for(const sub of root.querySelectorAll('sub')){
  if(sub.textContent.trim().toLowerCase()!=='z')continue;
  const node=sub.previousSibling;
  if(!node||node.nodeType!==Node.TEXT_NODE)continue;
  const match=node.textContent.match(/([0-9↊↋][0-9↊↋,./]*)$/);
  if(!match)continue;
  const value=match[1].replace(/↊/g,symbols[0]).replace(/↋/g,symbols[1]);
  node.textContent=node.textContent.slice(0,-match[1].length)+value;
  if($('digits').value==='real-pitman' && /[↊↋]/.test(value)){
   const span=document.createElement('span');span.className='real-pitman-glossary';
   span.textContent=value;
   node.parentNode.insertBefore(span,sub);
   node.textContent=node.textContent.slice(0,-value.length);
  }
 }
}
function showUnitGlossary(target,event){
 unitGlossaryPopup.innerHTML=unitGlossaries[target.dataset.glossary];
 applyGlossaryDigitSet(unitGlossaryPopup);
 unitGlossaryPopup.hidden=false;
 const r=target.getBoundingClientRect();
 placeUnitGlossary(event?.clientX??r.left,event?.clientY??r.bottom);
}

function markGlossaryTerms(html){return html.replace(/(tricia·quarterday|bicia·quarterday|hexcia·semiday|pentcia·semiday|uncia·quarterday|quadcia·semiday|tricia·semiday|uncia·semiday|tricia·day|uncia·day|bicia·semiday|bicia·day|quadcia·day|pentcia·day|hexcia·day|twinkling|(?<![\p{L}·-])semivibe(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])blink(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])vibe(?=s?(?![\p{L}·-]))|breather|break|pause|(?<![\p{L}·-])verse(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])passage(?=s?(?![\p{L}·-]))|lull|trice|dwell|hour|bell|(?<![\p{L}·-])sweep(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])quarterday(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])phase(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])semiday(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])clock(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])day(?![\p{L}·-]))(s)?/giu,(_all,word,plural)=>{
 const key=word.toLowerCase();
 const group=key==='tricia·quarterday'?'verse':key==='bicia·quarterday'?'passage':key==='hexcia·semiday'?'semivibe':key==='pentcia·semiday'?'blink':key==='quadcia·semiday'?'pause':key==='tricia·semiday'?'sweep':key==='quarterday'?'phase':key==='semiday'?'clock':key==='uncia·quarterday'?'bell':key==='uncia·semiday'?'hour':key==='uncia·day'?'dwell':key==='bicia·day'?'breather':key==='bicia·semiday'?'break':key==='tricia·day'?'trice':key==='quadcia·day'?'lull':key==='pentcia·day'?'twinkling':key==='hexcia·day'?'vibe':key;
 return `<span class="unit-glossary-help" data-glossary="${group}" tabindex="0" aria-describedby="unit-glossary">${word}${plural||''}</span>`;
});}
function updateUnitName(id){
 const index=Math.min(digitalSettings[id].precision,digitalSettings[id].radix);

function renderLegends(){

 const terminology=$('terminology').value;
 for(const id of clockIds){

   const lines=legendUnits[id].map(([name,measure],i)=>`${i} = ${terminology==='colloquial'?colloquialNames[id][i]:name} = ${measure}`);
   lines.push('',...legendExtra(id,start,terminology));
   const title=document.createElement('div');title.className='clock-legend-title';title.textContent='Digit Positions:';
   const rows=lines.map((line,i)=>{

     const parts=line.split(' = ');

     if(parts.length>nameIndex+1)parts[nameIndex]=`<strong>${parts[nameIndex]}</strong>`;
     row.innerHTML=parts.join(' = ').replace(/<strong>(.*?)<\/strong>/g, (_match, boldText)=>`<strong>${markGlossaryTerms(boldText)}</strong>`).replace(/r([0-9]+)/g, (_match, repeating)=>`<span class="repeating-digits">${repeating}</span>`).replace(/\[([dz])\]/g, (_match, base)=>`<sub>${base}</sub>`);
     if(i>=7 && /^(?:Quarterdays|Phases|Semidays|Clocks|Tiercerdays|Shifts):$/.test(line))row.style.fontWeight='700';

 }

function closeDropdowns(except){document.querySelectorAll('.color-dropdown-menu').forEach(m=>{if(m!==except)m.hidden=true});document.querySelectorAll('.color-dropdown-trigger').forEach(b=>{if(b.nextElementSibling!==except)b.setAttribute('aria-expanded','false')})}
function buildDropdown(id,kind){
  // Compact numeric spinner, retaining the original per-position color palette.
  const parent=$('dial-'+id).querySelector(`[data-kind="${kind}"]`);
  const settings=digitalSettings[id];
  const minimum=kind==='radix'?0:2;
  const maximum=kind==='hands'?5:6;
  parent.replaceChildren();
  parent.classList.add('numeric-spinner');
  parent.setAttribute('role','group');
  parent.setAttribute('aria-label',kind==='hands'?'Hands':kind==='precision'?'Digit Precision':'Radix Point After');
  const valueBox=document.createElement('span');
  valueBox.className='spinner-value';
  valueBox.setAttribute('aria-live','off');
  const buttons=document.createElement('span');buttons.className='spinner-buttons';
  const up=document.createElement('button');up.type='button';up.className='spinner-arrow';up.textContent='▲';up.setAttribute('aria-label','Increase '+parent.getAttribute('aria-label'));
  const down=document.createElement('button');down.type='button';down.className='spinner-arrow';down.textContent='▼';down.setAttribute('aria-label','Decrease '+parent.getAttribute('aria-label'));
  function render(){
    valueBox.replaceChildren(coloredChoice(settings[kind]));
    up.disabled=settings[kind]>=maximum;
    down.disabled=settings[kind]<=minimum;
    parent.setAttribute('aria-valuenow',String(settings[kind]));
  }
  function change(delta){
    const next=Math.max(minimum,Math.min(maximum,settings[kind]+delta));
    if(next===settings[kind])return;
    settings[kind]=next;
    render();updateUnitName(id);savePreferences();
  }
  up.addEventListener('click',()=>change(1));
  down.addEventListener('click',()=>change(-1));
  parent.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){
      e.preventDefault();change(e.key==='ArrowUp'?1:-1);
    }
  });
  buttons.append(up,down);parent.append(valueBox,buttons);render();
}
function refreshDigitalControls(id){buildDropdown(id,'hands');buildDropdown(id,'precision');buildDropdown(id,'radix')}

function draw(spec,hours){const [id,title,period,zeroUp]=spec, el=$('dial-'+id),canvas=el.querySelector('canvas'),ctx=canvas.getContext('2d');const w=700,c=w/2,R=310;ctx.clearRect(0,0,w,w);const start=Number($('start').value),direction=Number($('direction').value);const fraction=mod(hours-start,period)/period;const turn=mod(hours-start,period)/period;const base={up:-Math.PI/2,left:Math.PI,down:Math.PI/2,right:0}[digitalSettings[id].orientation];const angle=f=>base+direction*2*Math.PI*f;
const gradient=ctx.createRadialGradient(c,c,30,c,c,R);gradient.addColorStop(0,'#32466b');gradient.addColorStop(.75,'#172742');gradient.addColorStop(1,'#08111f');ctx.beginPath();ctx.arc(c,c,R+13,0,Math.PI*2);ctx.fillStyle='#b6c1d3';ctx.fill();ctx.beginPath();ctx.arc(c,c,R+7,0,Math.PI*2);ctx.fillStyle=gradient;ctx.fill();

for(let i=0;i<144;i++){if(!$('marks').checked&&i%12!==0)continue;const major=i%12===0,quarter=i%3===0;const a=angle(i/144),r1=R-(major?30:quarter?20:11),r2=R-3;ctx.beginPath();ctx.moveTo(c+r1*Math.cos(a),c+r1*Math.sin(a));ctx.lineTo(c+r2*Math.cos(a),c+r2*Math.sin(a));ctx.strokeStyle=major?'#f3f5fa':quarter?'#b2bccc':'#62748e';ctx.lineWidth=major?3:1;ctx.stroke()}
if($('labels').checked)for(let i=0;i<12;i++){const a=angle(i/12);ctx.fillStyle='#f4f7ff';ctx.font='bold 30px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';const glyph=numeral(i),x=c+(R-75)*Math.cos(a),y=c+(R-75)*Math.sin(a);if($('digits').value==='↊↋'&&(glyph==='↊'||glyph==='↋')){ctx.save();ctx.translate(x,y);const source=glyph==='↊'?'2':'3';ctx.rotate(Math.PI);ctx.fillText(source,0,0);ctx.restore()}else if(isRealPitmanGlyph(glyph)){ctx.save();ctx.font='bold 30px \"Uncial Real Pitman\", system-ui, sans-serif';ctx.fillText(glyph,x,y);ctx.restore()}else ctx.fillText(glyph,x,y)}
// Corner captions follow the original Java dial's day-start-dependent legends.

const shiftIndex=Math.floor(mod(hours-start,24)/8);
let cornerTexts;
if(id==='diurnal') cornerTexts=Array.from({length:4},(_,i)=>phaseNames[mod(dayStartIndex+i,4)]);
else if(id==='phasic') cornerTexts=Array(4).fill(phaseNames[mod(dayStartIndex+phaseIndex,4)]);
else if(id==='semidiurnal') {
  const semidayIndex=Math.floor(mod(hours-start,24)/12);

} else {

// Place captions in the four diagonal corners outside the dial rim.
