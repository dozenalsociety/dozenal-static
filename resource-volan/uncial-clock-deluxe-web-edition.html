/* Compact vertical-arrow spinners for the three numeric dial settings. */
.numeric-spinner{display:inline-flex;align-items:stretch;width:48px;min-width:48px;height:30px;box-sizing:border-box;background:#111d30;border:1px solid #526078;border-radius:6px;overflow:hidden}
.numeric-spinner .spinner-value{flex:1;display:flex;align-items:center;justify-content:center;font:16px ui-monospace,monospace;min-width:0}
.numeric-spinner .spinner-buttons{display:flex;flex-direction:column;width:17px;border-left:1px solid #526078}
.numeric-spinner .spinner-arrow{flex:1;display:grid;place-items:center;width:100%;min-height:0;padding:0;border:0;background:#273750;color:#e7ecf5;font:9px/1 system-ui,sans-serif;cursor:pointer}
.numeric-spinner .spinner-arrow:first-child{border-bottom:1px solid #526078}
.numeric-spinner .spinner-arrow:hover:not(:disabled),.numeric-spinner .spinner-arrow:focus-visible{background:#42618b;outline:none}
.numeric-spinner .spinner-arrow:disabled{opacity:.35;cursor:default}

/* Shared glossary popups for colloquial and technical time units. */
.tooltip-highlight{background:#59677c!important;border-radius:5px;box-shadow:0 0 0 3px #59677c}.unit-glossary-help{border-bottom:1px dotted rgba(190,207,231,.55);cursor:pointer}
#unit-glossary{position:fixed;z-index:1000;max-width:min(390px,calc(100vw - 24px));padding:12px 14px;background:#243650;border:1px solid #8ca3c4;border-radius:8px;box-shadow:0 8px 26px #000a;color:#fff;font:13px/1.5 system-ui,sans-serif;pointer-events:auto}
#unit-glossary a:link,#unit-glossary a:visited{color:#9edbff;text-decoration:underline;text-underline-offset:2px}
#unit-glossary[hidden]{display:none}
#unit-glossary p{margin:0 0 7px;color:inherit}#unit-glossary p:last-child{margin-bottom:0}
.real-pitman-glossary{font-family:"Uncial Real Pitman",system-ui,sans-serif}
/* One shared pair of controls in the date/time-zone heading. */
.zone-heading{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-items:center;gap:5px;text-align:center}
.zone-heading.zone-heading .zone-date{order:initial;margin-top:0;flex:initial;text-align:center}
.zone-heading.zone-heading #zone-description{text-align:center;min-width:0;overflow-wrap:anywhere}
.zone-heading .clock-actions{display:flex;align-items:center;justify-content:center;gap:1px;min-height:24px}
.zone-heading.side-by-side{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px}
.zone-heading.side-by-side .zone-date{grid-column:1;grid-row:1;justify-self:start;text-align:left}
.zone-heading.side-by-side .clock-actions{grid-column:2;grid-row:1}
.zone-heading.side-by-side #zone-description{grid-column:3;grid-row:1;justify-self:end;text-align:right}
.zone-heading:not(.side-by-side) .zone-date{grid-row:1}
.zone-heading:not(.side-by-side) #zone-description{grid-row:2}
.zone-heading:not(.side-by-side) .clock-actions{grid-row:3}
.clock-actions button{border:0;background:transparent;color:inherit;font:22px/1 "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",system-ui,sans-serif;width:24px;height:24px;display:grid;place-items:center;padding:0;cursor:pointer;appearance:none}
.clock-actions button:hover,.clock-actions button:focus-visible{background:transparent;outline-offset:2px}
.clock-actions button[hidden]{display:none}
.dial canvas.drag-enabled{touch-action:none;cursor:grab}.dial canvas.dragging-hand{cursor:grabbing}

/* Calendar control appears beside the date only while the clock is paused. */
.date-with-picker{display:flex;align-items:center;justify-content:center;gap:5px;min-width:0}
.date-with-picker #clock-calendar{border:0;background:transparent;padding:0;margin:0;width:25px;height:25px;font:22px/1 "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",system-ui,sans-serif;cursor:pointer;flex:none}
/* Browser-independent Gregorian calendar with dozenal numerals. */
.calendar-picker-control{position:relative;display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;flex:none}
.calendar-picker-control[hidden]{display:none}
.date-with-picker #clock-calendar[hidden]{display:none}
.dozenal-calendar{position:fixed;z-index:1250;width:min(310px,calc(100vw - 20px));padding:12px;border:1px solid #8ca3c4;border-radius:10px;background:#243650;color:#fff;box-shadow:0 10px 30px #0009;font:14px/1.4 system-ui,sans-serif}
.dozenal-calendar[hidden]{display:none}
.dozenal-calendar .cal-heading{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:9px}
.dozenal-calendar .cal-heading strong{font-size:15px;text-align:center;flex:1}
.dozenal-calendar button{font:inherit;color:inherit;background:transparent;border:0;border-radius:5px;cursor:pointer;min-width:0;min-height:32px;padding:3px}
.dozenal-calendar button:hover,.dozenal-calendar button:focus-visible{background:#45638b;outline-offset:1px}
.dozenal-calendar .cal-nav{width:32px;font-size:21px}
.dozenal-calendar .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.dozenal-calendar .cal-weekday{font-size:11px;color:#b9cbe4;padding:5px 0}
.dozenal-calendar .cal-day{width:100%;font-variant-numeric:tabular-nums}
.dozenal-calendar .cal-day.today{outline:1px solid #9edbff;outline-offset:-2px}
.dozenal-calendar .cal-day.selected{background:#3477ba;color:#fff;font-weight:700}
 .dozenal-calendar .cal-year-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:9px 0}
.dozenal-calendar .cal-year-grid button{border:1px solid #56718f;font-variant-numeric:tabular-nums}
.dozenal-calendar .cal-year-grid button.selected{background:#3477ba;font-weight:700}
.dozenal-calendar .cal-heading .cal-title-button{flex:1;font-weight:700;font-size:15px;white-space:nowrap}
.dozenal-calendar .cal-error{font-size:12px;color:#ffb4b4;margin:3px 0}
.dozenal-calendar .cal-footer{display:flex;justify-content:center;margin-top:9px}
.dozenal-calendar .cal-footer button{padding:4px 12px;background:#385677}
.dozenal-calendar .real-pitman-glyph{vertical-align:baseline}
.zone-heading.side-by-side .date-with-picker{grid-column:1;grid-row:1;justify-self:start}
.zone-heading:not(.side-by-side) .date-with-picker{grid-row:1}
.zone-heading.side-by-side .zone-date{grid-column:auto;grid-row:auto;justify-self:auto}
#zone-description{cursor:default;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:rgba(190,207,231,.55);text-underline-offset:4px;text-decoration-thickness:1px}
#zone-dst-tooltip{position:fixed;z-index:1100;max-width:min(410px,calc(100vw - 24px));padding:12px 14px;background:#243650;border:1px solid #8ca3c4;border-radius:8px;box-shadow:0 8px 26px #000a;color:#fff;font:13px/1.5 system-ui,sans-serif;pointer-events:auto}
#zone-dst-tooltip[hidden]{display:none}#zone-dst-tooltip p{margin:0 0 6px;color:inherit}#zone-dst-tooltip p:last-child{margin-bottom:0}

/* Keep the dial settings control beside the Time row, at the left panel edge.
   The Zone Offset row is only present while settings are expanded. */
.digital-display{position:relative}
.digital-display>.dial-toggle{position:absolute;left:0;top:4px;z-index:2}
.dial-bottom{min-height:0}
.dial-bottom .offset-panel{padding-right:0}
.dial-bottom .offset-panel .digital-trailing{padding-left:9px}
.dial:has(.dial-toggle[aria-expanded="false"]) .dial-bottom{display:none}
</style></head><body><header><h1>Uncial Clock Deluxe (Web Edition)</h1><p>Dozenal numbers are annotated with a subscript-z. Decimal numbers are annotated with a subscript-d.</p><button type="button" class="settings-toggle" id="settings-toggle" aria-label="Show global settings" aria-expanded="false" aria-controls="settings-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></header><main><div id="settings-panel" class="settings-panel" hidden><div class="controls"><label>Digit set <select id="digits"><option value="↊↋">Pitman (↊ ↋)</option><option value="real-pitman">Real Pitman (↊ ↋)</option><option value="ᘔƐ">Alt Pitman (ᘔ Ɛ)</option><option value="XE">DSA (X E)</option><option value="TE">DSGB (T E)</option><option value="AB">Computerese (A B)</option></select></label><label>Terminology <select id="terminology"><option value="colloquial" selected>Colloquial</option><option value="technical">Technical</option></select></label><label>Movement <select id="movement"><option value="continuous">Continuous</option><option value="discrete">Discrete</option></select></label><label><button type="button" class="click-help" aria-label="About Day begins" data-help="Sunrise and sunset are fixed six-hour reference points, not astronomical sunrise or sunset.">Day begins</button> <select id="start"><option value="0">Midnight</option><option value="6">Sunrise (06:00)</option><option value="12">Noon</option><option value="18">Sunset (18:00)</option></select></label><label>Direction <select id="direction"><option value="1">Clockwise</option><option value="-1">Counterclockwise</option></select></label><label>Time zone <select id="zone"></select></label></div><div class="controls" style="margin-top:10px" id="visibility"><label><input type="checkbox" value="diurnal" checked>Diurnal</label><label><input type="checkbox" value="semidiurnal" checked>Semidiurnal</label><label><input type="checkbox" value="shiftic">Shiftic</label><label><input type="checkb  verse:'<p><b>Verse</b>: (1) 1/1000<sub>z</sub> = 1/1728<sub>d</sub> of a quarterday, equivalent to 0.3<sub>z</sub> trices or 10.6<sub>z</sub> = 12.5<sub>d</sub> seconds; a <b>verse·duration</b> or <b>tricia·quarterday</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun during a verse; 1/1000<sub>z</sub> = 1/1728<sub>d</sub> of a quarterturn or phase, equivalent to 3′07.5″<sub>d</sub> of arc; a <b>verse·angle</b> or <b>tricia·quarterturn</b>.</p><p><i>Etymology:</i> Approximate time to read a verse of poetry.</p>',
 passage:'<p><b>Passage</b>: (1) 1/100<sub>z</sub> = 1/144<sub>d</sub> of a quarterday, equivalent to 3 trices or 2.5<sub>d</sub> minutes; a <b>passage·duration</b> or <b>bicia·quarterday</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun during a passage; 1/100<sub>z</sub> = 1/144<sub>d</sub> of a quarterturn or phase, equivalent to 37.5′<sub>d</sub> of arc; a <b>passage·angle</b> or <b>bicia·quarterturn</b>.</p><p><i>Etymology:</i> About the time to read a “passage” in a typical novel. Also an allusion to “the passage of time”.</p>',
 phase:'<p><b>Phase</b>: A quarter of a mean solar day, i.e., a <b>quarterday</b>; 6 hours; 260<sub>z</sub> = 360<sub>d</sub> minutes; 10,600<sub>z</sub> = 21,600<sub>d</sub> seconds; one quarter <b>prime·hexqua·timel</b>, i.e. 300,000<sub>z</sub> = 746,496<sub>d</sub> prime·timels (where the <b>prime·timel</b> is the coherent unit of time for physics in the <b>Primel</b> metrology).</p><p>This is the duration of a <b>quarterturn,</b> or a quarter rotation, or <b>quadrant</b> of the Earth with respect to the Sun (300<sub>z</sub> trice·angles or 90°<sub>d</sub> of arc).</p><p><i>Etymology:</i> By analogy with phases of the Moon.</p>',
 semivibe:'<p><b>Semivibe</b>: (1) 1/2,000,000<sub>z</sub> = 1/5,971,968<sub>d</sub> of a day, equivalent to 0.021<sub>z</sub> = 0.014467<span class="repeating-digits">592</span><sub>d</sub> seconds; a <b>semivibe·duration</b> or <b>hexcia·semiday</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun in a semivibe; 1/2,000,000<sub>z</sub> = 1/5,971,968<sub>d</sub> of a turn, equivalent to 0.217013<span class="repeating-digits">8</span>″<sub>d</sub> of arc; a <b>semivibe·angle</b> or <b>hexcia·semiturn</b>.</p><p><i>Etymology:</i> Half of a vibe. This is the period for a frequency of 69.12<sub>d</sub> hertz (2 <b>prime·frequenciels</b>). As a sound, this is approximately C-sharp in octave 1 (C♯<sub>1</sub>).</p>',
 blink:'<p><b>Blink</b>: (1) 1/200,000<sub>z</sub> = 1/497,664<sub>d</sub> of a day, equivalent to 0.21<sub>z</sub> = 0.1736<span class="repeating-digits">1</span><sub>d</sub> seconds; a <b>blink·duration</b> or <b>pentcia·semiday</b>. This is the <b>Tim</b>, the coherent unit of time in Tom Pendlebury\'s <b>TGM</b> metrology.</p><p>(2) The amount the Earth rotates with respect to the Sun in a blink; 1/200,000<sub>z</sub> = 1/497,664<sub>d</sub> of a turn, equivalent to 2.6041<span class="repeating-digits">6</span>″<sub>d</sub> of arc; a <b>blink·angle</b> or <b>pentcia·semiturn</b>.</p><p><i>Etymology:</i> This is about the lower end of the range for the duration an eye blink.</p>',
 pause:'<p><b>Pause</b>: (1) 1/10,000<sub>z</sub> = 1/20,736<sub>d</sub> of a semiday; a <b>pause·duration</b> or <b>quadcia·semiday</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun during a sweep; 1/10.000<sub>z</sub> = 1/20,736<sub>d</sub> of a semiturn, equivalent to 31.25″<sub>d</sub> of arc; a <b>pause·angle</b> or <b>quadcia·semiturn</b>.</p><p><i>Etymology:</i> About the time for a brief “pause” or hesitation in speech (cf. the <a href="https://web.archive.org/web/20260326143634if_/https://grandadmiralpetry.tripod.com/metric.html">hesit</a> time unit). Usage of “pause” borrowed from Greg Egan’s <i>Orthogonal</i> trilogy.</p>',
 sweep:'<p><b>Sweep</b>: (1) 1/1000<sub>z</sub> = 1/1728<sub>d</sub> of a semiday, equivalent to 21<sub>z</sub> = 25<sub>d</sub> seconds; a <b>sweep·duration</b> or <b>tricia·semiday</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun during a sweep; 1/1000<sub>z</sub> = 1/1728<sub>d</sub> of a semiturn, equivalent to 6′15″<sub>d</sub> of arc; a <b>sweep·angle</b> or <b>tricia·semiturn</b>.</p><p><i>Etymology:</i> From the expression “sweep second hand,” although even more apt since the hand which has this period (the pause hand) “sweeps” more than twice as fast as the second hand on a traditional clock.</p>',
 clock:'<p><b>Clock</b>: Half of a mean solar day, i.e., a <b>semiday</b>; 10<sub>z</sub> = 12<sub>d</sub> hours; 500<sub>z</sub> = 720<sub>d</sub> minutes; 21,000<sub>z</sub> = 43,200<sub>d</sub> seconds; one half <b>prime·hexqua·timel</b>, i.e. 600,000<sub>z</sub> = 1,492,992<sub>d</sub> prime·timels (where the <b>prime·timel</b> is the coherent unit of time for physics in the <b>Primel</b> metrology).</p><p>This is the duration of a <b>semiturn,</b> or half-rotation, of the Earth with respect to the Sun (600<sub>z</sub> trice·angles or 180°<sub>d</sub> of arc).</p><p><i>Etymology:</i> This is the period of a traditional sexagesimal clock.</p>',
 day:'<p><b>Day</b>: A mean solar day; the duration of one full <b>turn</b> or <b>rotation</b> of the Earth with respect to the Sun; 20<sub>z</sub> = 24<sub>d</sub> hours; ↊00<sub>z</sub> = 1,440<sub>d</sub> minutes; 42,000<sub>z</sub> = 86,400<sub>d</sub> seconds; one <b>prime·hexqua·timel</b>, i.e. 1,000,000<sub>z</sub> = 2,985,984<sub>d</sub> prime·timels (where the <b>prime·timel</b> is the coherent unit of time for physics in the <b>Primel</b> metrology).</p>',
 vibe:'<p><b>Vibe</b>: (1) 1/1,000,000<sub>z</sub> = 1/2,985,984<sub>d</sub> of a day, equivalent to 0.042<sub>z</sub> = 0.02893<span class="repeating-digits">518</span><sub>d</sub> seconds; a <b>vibe·duration</b> or <b>hexcia·day</b>. This is the <b>prime·timel</b>, the coherent unit of time for physics in the <b>Primel</b> metrology.</p><p>(2) The amount the Earth rotates with respect to the Sun during a vibe; 1/1,000,000<sub>z</sub> = 1/2,985,984<sub>d</sub> of a turn, equivalent to 0.43402<span class="repeating-digits">7</span>″<sub>d</sub> of arc; a <b>vibe·angle</b> or <b>hexcia·turn</b>.</p><p><i>Etymology:</i> Colloquial contraction of “vibration.” This is the period for a frequency of 34.56<sub>d</sub> hertz (1 <b>prime·frequenciel</b>). As a sound, this is approximately C-sharp in octave 0 (C♯<sub>0</sub>), a vibration near the threshold of the audible range.</p>',
 twinkling:'<p><b>Twinkling</b>: (1) 1/100,000<sub>z</sub> = 1/248,832<sub>d</sub> of a day, equivalent to 0.42<sub>z</sub> = 0.347<span class="repeating-digits">2</span><sub>d</sub> seconds; a <b>twinkling·duration</b> or <b>pentcia·day</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun in a twinkling; 1/100,000<sub>z</sub> = 1/248,832<sub>d</sub> of a turn, equivalent to 5.208<span style="text-decoration:overline">3</span>″<sub>d</sub> of arc; a <b>twinkling·angle</b> or <b>pentcia·turn</b>.</p><p><i>Etymology:</i> A slightly archaic word for a very brief amount time, akin to the blink of an eye. At slightly more than a third of a second, this is in fact about the upper limit for an eye blink.</p>',
 lull:'<p><b>Lull</b>: (1) 1/10,000<sub>z</sub> = 1/20,736<sub>d</sub> of a day, equivalent to 4.2<sub>z</sub> = 4.1<span class="repeating-digits">6</span><sub>d</sub> seconds; a <b>lull·duration</b> or <b>quadcia·day</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun in a <b>quadcia·day</b>; 1/10,000<sub>z</sub> = 1/20,736<sub>d</sub> of a turn, equivalent to 1′2.5″<sub>d</sub> of arc; a <b>lull·angle</b> or <b>quadcia·turn</b>.</p><p><i>Etymology:</i> At slightly more than 4 seconds, this is enough for a long, embarrassing pause in a conversation, i.e., a “lull.”</p>',
 trice:'<p><b>Trice</b>: (1) 1/1000<sub>z</sub> = 1/1728<sub>d</sub> of a day, equivalent to 42<sub>z</sub> = 50<sub>d</sub> seconds; a <b>trice·duration</b> or <b>tricia·day</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun in a trice; 1/1000<sub>z</sub> = 1/1728<sub>d</sub> of a turn, equivalent to 12′30″<sub>d</sub> of arc; a <b>trice·angle</b> or <b>tricia·turn</b>.</p><p><i>Etymology:</i> A slightly archaic word for a brief amount of time, and a pun on dividing the day by a dozen “thrice”.</p>',
 break:'<p><b>Break</b>: (1) 1/100<sub>z</sub> = 1/144<sub>d</sub> (one pergross) of a semiday, equivalent to 6 trices or 5 minutes; a <b>break·duration</b> or <b>bicia·semiday</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun during a break; 1/100<sub>z</sub> = 1/144<sub>d</sub> (one pergross) of a semiturn, equivalent to 6 trices or 1°15′<sub>d</sub> of arc; a <b>break·angle</b> or <b>bicia·semiturn</b>.</p><p><i>Etymology:</i> From the colloquial expression “take a break,” indicating a brief time of rest from effort. Related to the expression “take five,” with similar meaning referencing five minutes, but without any sexagesimal association.</p>',
 breather:'<p><b>Breather</b>: (1) 1/100<sub>z</sub> = 1/144<sub>d</sub> (one pergross) of a day, equivalent to 10<sub>z</sub> trices or 10<sub>d</sub> minutes; a <b>breather·duration</b> or <b>bicia·day</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun during a breather; 1/100<sub>z</sub> = 1/144<sub>d</sub> (one pergross) of a turn. equivalent to 10<sub>z</sub> trices or 2°30′<sub>d</sub> of arc; a <b>breather·angle</b> or <b>bicia·turn</b>.</p><p><i>Etymology:</i> From the colloquial expression “take a breather,” indicating a brief time of rest from effort. Related to the expression “take ten,” with similar meaning referencing ten minutes, but without any sexagesimal association.</p>',
 dwell:'<p><b>Dwell</b>: (1) 1/10<sub>z</sub> = 1/12<sub>d</sub> of a day, equivalent to 100<sub>z</sub> trices or 120<sub>d</sub> minutes; two hours; a <b>dwell·duration</b> or <b>uncia·day</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun during a dwell; 1/10<sub>z</sub> = 1/12<sub>d</sub> of a turn, equivalent to 100<sub>z</sub> trices or 30°<sub>d</sub> of arc; a <b>dwell·angle</b> or <b>uncia·turn</b>.</p><p><i>Etymology:</i> The time the Sun spends “dwelling” in each “house” during a day, where a <b>house</b> is an astrological term for an <b>uncia·turn</b> sector of the sky relative to the observer; also, a pun on “dual hour”. If anyone focuses their attention on any one subject for an entire dwell, it is fair to say that the are “dwelling” on it.</p>',
 hour:'<p><b>Hour</b>: (1) 1/20<sub>z</sub> = 1/24<sub>d</sub> of a day, equivalent to 60<sub>z</sub> trices or 60<sub>d</sub> minutes; a half-dwell; an <b>hour·duration</b> or <b>uncia·semiday</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun in an hour; 1/20<sub>z</sub> = 1/24<sub>d</sub> of a turn, equivalent to 60<sub>z</sub> trices or 15°<sub>d</sub> of arc; an <b>hour·angle</b> or <b>uncia·semiturn</b>.</p><p><i>Etymology:</i> From Greek <i>ὥρα</i> “hour; any time or period.”</p>',
 bell:'<p><b>Bell</b>: (1) 1/40<sub>z</sub> = 1/48<sub>d</sub> of a day, equivalent to 30<sub>z</sub> trices or 30<sub>d</sub> minutes; a half-hour or quarter-dwell; a <b>bell·duration</b> or <b>uncia·quarterday</b>.</p><p>(2) The amount the Earth rotates with respect to the Sun in a bell; 1/40<sub>z</sub> = 1/48<sub>d</sub> of a turn, equivalent to 30<sub>z</sub> trices or 7°30′<sub>d</sub> of arc; a <b>bell·angle</b> or <b>uncia·quarterturn</b>.</p><p><i>Etymology:</i> From nautical terminology, a “ship’s bell.”</p>'
};
const unitGlossaryPopup=document.createElement('div');
unitGlossaryPopup.id='unit-glossary';unitGlossaryPopup.setAttribute('role','tooltip');unitGlossaryPopup.hidden=true;
document.body.append(unitGlossaryPopup);
function placeUnitGlossary(x,y){
 const w=unitGlossaryPopup.offsetWidth,h=unitGlossaryPopup.offsetHeight;
 const gap=52;
 let left=x+gap,top=y+gap;
 if(left+w>innerWidth-8)left=x-w-gap;
 if(top+h>innerHeight-8)top=y-h-gap;
 unitGlossaryPopup.style.left=Math.max(8,left)+'px';
 unitGlossaryPopup.style.top=Math.max(8,top)+'px';
}
// Convert transdecimal digits in tooltip numerals tagged with a dozenal subscript.
// Ordinary prose and decimal numerals are deliberately left untouched.
function applyGlossaryDigitSet(root){
 const symbols=digitSymbols();
 for(const sub of root.querySelectorAll('sub')){
  if(sub.textContent.trim().toLowerCase()!=='z')continue;
  const node=sub.previousSibling;
  if(!node||node.nodeType!==Node.TEXT_NODE)continue;
  const match=node.textContent.match(/([0-9↊↋][0-9↊↋,./]*)$/);
  if(!match)continue;
  const value=match[1].replace(/↊/g,symbols[0]).replace(/↋/g,symbols[1]);
  node.textContent=node.textContent.slice(0,-match[1].length)+value;
  if($('digits').value==='real-pitman' && /[↊↋]/.test(value)){
   const span=document.createElement('span');span.className='real-pitman-glossary';
   span.textContent=value;
   node.parentNode.insertBefore(span,sub);
   node.textContent=node.textContent.slice(0,-value.length);
  }
 }
}
function highlightTooltipTrigger(target){
 document.querySelectorAll('.tooltip-highlight').forEach(el=>el.classList.remove('tooltip-highlight'));
 target?.classList.add('tooltip-highlight');
}
function showUnitGlossary(target,event){
 highlightTooltipTrigger(target);
 unitGlossaryPopup.innerHTML=unitGlossaries[target.dataset.glossary];
 applyGlossaryDigitSet(unitGlossaryPopup);
 unitGlossaryPopup.hidden=false;
 const r=target.getBoundingClientRect();
 placeUnitGlossary(event?.clientX??r.left,event?.clientY??r.bottom);
}
document.addEventListener('click',e=>{const target=e.target.closest?.('.unit-glossary-help');if(target){e.preventDefault();showUnitGlossary(target,e)}});
// Keep the popup stationary after opening so the pointer can move into it and activate links.
// Keep the popup open when the pointer leaves the term, including while entering the popup.
document.addEventListener('keydown',e=>{const target=e.target.closest?.('.unit-glossary-help');if(target&&(e.key==='Enter'||e.key===' ')){e.preventDefault();showUnitGlossary(target)}});
// Dismiss only when clicking outside both the popup and glossary terms.
document.addEventListener('click',e=>{
 const target=e.target.closest?.('.click-help');
 if(!target)return;
 highlightTooltipTrigger(target);
 unitGlossaryPopup.textContent=target.dataset.help;
 unitGlossaryPopup.hidden=false;
 const r=target.getBoundingClientRect();
 placeUnitGlossary(e.clientX??r.left,e.clientY??r.bottom);
});
document.addEventListener('keydown',e=>{
 const target=e.target.closest?.('.click-help');
 if(target&&(e.key==='Enter'||e.key===' ')){
  e.preventDefault();highlightTooltipTrigger(target);unitGlossaryPopup.textContent=target.dataset.help;
  unitGlossaryPopup.hidden=false;
  const r=target.getBoundingClientRect();placeUnitGlossary(r.left,r.bottom);
 }
});
document.addEventListener('click',e=>{
 if(unitGlossaryPopup.hidden)return;
 if(unitGlossaryPopup.contains(e.target)||e.target.closest?.('.unit-glossary-help, .click-help'))return;
 unitGlossaryPopup.hidden=true;
 document.querySelectorAll('.tooltip-highlight').forEach(el=>el.classList.remove('tooltip-highlight'));
});
function markGlossaryTerms(html){return html.replace(/(pentcia·tiercerday|(?<![\p{L}·-])flutter(?=s?(?![\p{L}·-]))|quadcia·tiercerday|(?<![\p{L}·-])plodding(?=s?(?![\p{L}·-]))|hexcia·tiercerday|(?<![\p{L}·-])tiercervibe(?=s?(?![\p{L}·-]))|hexcia·quarterday|(?<![\p{L}·-])quartervibe(?=s?(?![\p{L}·-]))|pentcia·quarterday|(?<![\p{L}·-])flicker(?=s?(?![\p{L}·-]))|quadcia·quarterday|(?<![\p{L}·-])beat(?=s?(?![\p{L}·-]))|tricia·tiercerday|(?<![\p{L}·-])spot(?=s?(?![\p{L}·-]))|bicia·tiercerday|(?<![\p{L}·-])song(?=s?(?![\p{L}·-]))|uncia·tiercerday|(?<![\p{L}·-])gong(?=s?(?![\p{L}·-]))|tricia·quarterday|bicia·quarterday|hexcia·semiday|pentcia·semiday|uncia·quarterday|quadcia·semiday|tricia·semiday|uncia·semiday|tricia·day|uncia·day|bicia·semiday|bicia·day|quadcia·day|pentcia·day|hexcia·day|twinkling|(?<![\p{L}·-])tiercerday(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])shift(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])semivibe(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])blink(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])vibe(?=s?(?![\p{L}·-]))|breather|break|pause|(?<![\p{L}·-])verse(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])passage(?=s?(?![\p{L}·-]))|lull|trice|dwell|hour|bell|(?<![\p{L}·-])sweep(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])quarterday(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])phase(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])semiday(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])clock(?=s?(?![\p{L}·-]))|(?<![\p{L}·-])day(?![\p{L}·-]))(s)?/giu,(_all,word,plural)=>{
 const key=word.toLowerCase();
 const group=key==='pentcia·tiercerday'?'flutter':key==='quadcia·tiercerday'?'plodding':key==='hexcia·tiercerday'?'tiercervibe':key==='hexcia·quarterday'?'quartervibe':key==='pentcia·quarterday'?'flicker':key==='quadcia·quarterday'?'beat':key==='tricia·tiercerday'?'spot':key==='bicia·tiercerday'?'song':key==='uncia·tiercerday'?'gong':key==='tiercerday'?'shift':key==='tricia·quarterday'?'verse':key==='bicia·quarterday'?'passage':key==='hexcia·semiday'?'semivibe':key==='pentcia·semiday'?'blink':key==='quadcia·semiday'?'pause':key==='tricia·semiday'?'sweep':key==='quarterday'?'phase':key==='semiday'?'clock':key==='uncia·quarterday'?'bell':key==='uncia·semiday'?'hour':key==='uncia·day'?'dwell':key==='bicia·day'?'breather':key==='bicia·semiday'?'break':key==='tricia·day'?'trice':key==='quadcia·day'?'lull':key==='pentcia·day'?'twinkling':key==='hexcia·day'?'vibe':key;
 return `<span class="unit-glossary-help" data-glossary="${group}" tabindex="0" aria-describedby="unit-glossary">${word}${plural||''}</span>`;
});}
function updateUnitName(id){
 const index=Math.min(digitalSettings[id].precision,digitalSettings[id].radix);
 const terminology=$('terminology').value;
 const name=terminology==='colloquial'?colloquialNames[id][index]:legendUnits[id][index][0];
 const label=$('dial-'+id).querySelector('.unit-name');
 label.innerHTML=markGlossaryTerms(name+'s');
 label.style.color=digitPalette[index];
}
function renderLegends(){
 const start=Number($('start').value);
 const terminology=$('terminology').value;
 for(const id of clockIds){
   const section=$('dial-'+id);
   const titleText=dialTitles[id][terminology];
   const visibilityCheckbox=document.querySelector(`#visibility input[type="checkbox"][value="${id}"]`);
   visibilityCheckbox.parentElement.lastChild.textContent=titleText.replace(/ Dial$/, '');
   section.querySelector('h2').textContent=titleText;
   const toggle=section.querySelector('.dial-toggle');
   toggle.setAttribute('aria-label',`${toggle.getAttribute('aria-expanded')==='true'?'Hide':'Show'} dial settings`);
   updateUnitName(id);
   const box=$('dial-'+id).querySelector('.clock-legend');
   const lines=legendUnits[id].map(([name,measure],i)=>`${i} = ${terminology==='colloquial'?colloquialNames[id][i]:name} = ${measure}`);
   lines.push('',...legendExtra(id,start,terminology));
   const title=document.createElement('div');title.className='clock-legend-title';title.textContent='Digit Positions:';
   const rows=lines.map((line,i)=>{
     const row=document.createElement('div');
     row.className='clock-legend-line'+(!line?' empty':'');
     row.style.color=i<7?digitPalette[i]:'#FFFFFF';
     // Bold the named unit/phase/clock/shift, not its leading position number or definition.
     const parts=line.split(' = ');
     const nameIndex=/^\d+$/.test(parts[0])?1:0;
     if(parts.length>nameIndex+1)parts[nameIndex]=`<strong>${parts[nameIndex]}</strong>`;
     row.innerHTML=parts.join(' = ').replace(/<strong>(.*?)<\/strong>/g, (_match, boldText)=>`<strong>${markGlossaryTerms(boldText)}</strong>`).replace(/r([0-9]+)/g, (_match, repeating)=>`<span class="repeating-digits">${repeating}</span>`).replace(/\[([dz])\]/g, (_match, base)=>`<sub>${base}</sub>`);
     if(i>=7 && /^(?:Quarterdays|Phases|Semidays|Clocks|Tiercerdays|Shifts):$/.test(line))row.style.fontWeight='700';
     return row;
   });
   box.replaceChildren(title,...rows);
 }
}
$('start').addEventListener('change',renderLegends);
$('terminology').addEventListener('change',renderLegends);
renderLegends();
function closeDropdowns(except){document.querySelectorAll('.color-dropdown-menu').forEach(m=>{if(m!==except)m.hidden=true});document.querySelectorAll('.color-dropdown-trigger').forEach(b=>{if(b.nextElementSibling!==except)b.setAttribute('aria-expanded','false')})}
function buildDropdown(id,kind){
  // Compact numeric spinner, retaining the original per-position color palette.
  const parent=$('dial-'+id).querySelector(`[data-kind="${kind}"]`);
  const settings=digitalSettings[id];
  const minimum=kind==='radix'?0:2;
  const maximum=kind==='hands'?5:6;
  parent.replaceChildren();
  parent.classList.add('numeric-spinner');
  parent.setAttribute('role','group');
